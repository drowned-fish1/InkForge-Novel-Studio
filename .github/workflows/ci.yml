name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  promo-video:
    name: promo video
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: promo-video
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: promo-video/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Formatting
        run: npm run format:check

      - name: Lint and typecheck
        run: npm run lint

      - name: Bundle compositions
        run: npm run build

  checks:
    name: gates (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck (builds workspace packages)
        run: npm run typecheck

      - name: Unit and service tests
        run: npm test

      - name: Desktop smoke (build + real main process end-to-end)
        run: npm run test:desktop-smoke

  package-windows:
    name: package (windows, unsigned)
    needs: [checks, promo-video]
    runs-on: windows-latest
    # Installer artifact for manual verification; signing requires the
    # external certificate (see docs/release-windows.md) and is not wired here.
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer (unsigned)
        run: npm run dist:windows

      - uses: actions/upload-artifact@v4
        with:
          name: inkforge-windows-installer
          path: apps/desktop/release/*.exe
          if-no-files-found: error
          retention-days: 14

  package-macos:
    name: package (macOS, unsigned)
    needs: [checks, promo-video]
    runs-on: macos-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build macOS artifacts (unsigned)
        run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: inkforge-macos
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
          if-no-files-found: error
          retention-days: 14

  package-linux:
    name: package (Linux, unsigned)
    needs: [checks, promo-video]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Linux artifacts
        run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: inkforge-linux
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
          if-no-files-found: error
          retention-days: 14
